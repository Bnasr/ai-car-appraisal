<!DOCTYPE html>
<html>

<head>
  <title>AI Car Appraisal</title>
</head>

<body>

<h2>AI Car Appraisal</h2>

<div id="chat"></div>

<input id="input" type="text">
<button onclick="send()">Send</button>

<script>

let step = 0;

let carMiles = 0;
let carCondition = "";
let carMechanical = "";

function send() {

  let inputBox = document.getElementById("input");
  let input = inputBox.value;

  if (input === "") {
    return;
  }

  let chat = document.getElementById("chat");

  chat.innerHTML += "<p><b>You:</b> " + input + "</p>";

  let reply = "";

  if (step === 0) {

    reply = "What’s the year, make, and model?";
    step = 1;

  }

  else if (step === 1) {

    reply = "How many miles?";
    step = 2;

  }

  else if (step === 2) {

    carMiles = parseInt(input);

    reply = "Condition? (clean / average / needs work)";
    step = 3;

  }

  else if (step === 3) {

    carCondition = input.toLowerCase();

    reply = "Any mechanical issues?";
    step = 4;

  }

  else if (step === 4) {

    carMechanical = input.toLowerCase();

    let value = 27000;

    // mileage adjustment
    value = value - ((carMiles - 40000) * 0.05);

    // condition adjustment
    if (carCondition.includes("clean")) {
      value += 1000;
    }

    if (carCondition.includes("average")) {
      value -= 1000;
    }

    if (carCondition.includes("work")) {
      value -= 3000;
    }

    // mechanical adjustment
    if (
      carMechanical.includes("yes") ||
      carMechanical.includes("light")
    ) {
      value -= 4000;
    }

    let low = Math.round(value - 1500);
    let high = Math.round(value + 1500);

    reply =
      "Based on what you described, a realistic trade range would likely fall around $" +
      low +
      " - $" +
      high +
      ".";

    step = 5;

  }

  else if (step === 5) {

    reply = "Would you like to explore possible offers? (yes/no)";
    step = 6;

  }

  else if (step === 6) {

    let answer = input.toLowerCase();

    if (answer === "yes") {

      reply = "What’s your name?";
      step = 7;

    }

    else if (answer === "no") {

      reply = "No problem at all — feel free to come back anytime.";
      step = 6;

    }

    else {

      reply = "Please type yes or no.";
      step = 6;

    }

  }

  else if (step === 7) {

    reply = "What’s your phone number?";
    step = 8;

  }

  else if (step === 8) {

    reply = "What’s your email address?";
    step = 9;

  }

  else if (step === 9) {

    reply = "Thank you — a dealer will contact you shortly.";

    step = 10;

  }

  else {

    reply = "Thanks for using AI Car Appraisal.";

  }

  chat.innerHTML += "<p><b>AI:</b> " + reply + "</p>";

  inputBox.value = "";

}

</script>

</body>

</html>

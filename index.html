<!DOCTYPE html>
<html>

<head>
  <title>AI Automotive Assistant</title>

  <style>
    body {
      font-family: Arial;
      max-width: 700px;
      margin: 40px auto;
      padding: 20px;
      background: #f5f5f5;
    }

    h2 {
      text-align: center;
    }

    #chat {
      background: white;
      border: 1px solid #ccc;
      padding: 15px;
      height: 450px;
      overflow-y: auto;
      margin-bottom: 15px;
    }

    .user {
      margin-bottom: 10px;
    }

    .ai {
      margin-bottom: 15px;
      color: #0b5394;
    }

    input {
      width: 75%;
      padding: 10px;
      font-size: 16px;
    }

    button {
      padding: 10px 20px;
      font-size: 16px;
      cursor: pointer;
    }
  </style>

</head>

<body>

<h2>AI Automotive Assistant</h2>

<div id="chat"></div>

<input id="input" type="text" placeholder="Type here...">

<button onclick="send()">Send</button>

<script>

let step = 0;

let car = {
  yearMakeModel: "",
  miles: 0,
  condition: "",
  mechanical: "",
  name: "",
  phone: "",
  email: ""
};

function addMessage(sender, text, className) {

  let chat = document.getElementById("chat");

  chat.innerHTML += `
    <div class="${className}">
      <b>${sender}:</b> ${text}
    </div>
  `;

  chat.scrollTop = chat.scrollHeight;
}

function send() {

  let inputBox = document.getElementById("input");

  let input = inputBox.value.trim();

  if (input === "") {
    return;
  }

  addMessage("You", input, "user");

  let reply = "";

  // STEP 0
  if (step === 0) {

    reply = "Hello! I’m your AI automotive assistant — how can I help make your visit easier today?";

    step = 1;
  }

  // STEP 1
  else if (step === 1) {

    reply = "Absolutely — I’d be happy to help with that. What’s the year, make, and model of the vehicle?";

    step = 2;
  }

  // STEP 2
  else if (step === 2) {

    car.yearMakeModel = input;

    reply = "How many miles are on the vehicle?";

    step = 3;
  }

  // STEP 3
  else if (step === 3) {

    car.miles = parseInt(input) || 0;

    reply = "How would you describe the condition? (clean / average / needs work)";

    step = 4;
  }

  // STEP 4
  else if (step === 4) {

    car.condition = input.toLowerCase();

    reply = "Are there any mechanical issues or warning lights?";

    step = 5;
  }

  // STEP 5
  else if (step === 5) {

    car.mechanical = input.toLowerCase();

    let value = 27000;

    // mileage adjustment
    value -= (car.miles - 40000) * 0.05;

    // condition adjustment
    if (car.condition.includes("clean")) {
      value += 1000;
    }

    if (car.condition.includes("average")) {
      value -= 1000;
    }

    if (car.condition.includes("work")) {
      value -= 3000;
    }

    // mechanical adjustment
    if (
      car.mechanical.includes("yes") ||
      car.mechanical.includes("light")
    ) {
      value -= 4000;
    }

    let low = Math.round(value - 1500);
    let high = Math.round(value + 1500);

    reply =
      "Based on what you described, a realistic trade range would likely fall around $" +
      low +
      " - $" +
      high +
      ". Keep in mind final value depends on inspection and market conditions.";

    step = 6;
  }

  // STEP 6
  else if (step === 6) {

    reply =
      "If you'd like, I can also help you explore real dealer offers or trade options. Would you like to continue? (yes/no)";

    step = 7;
  }

  // STEP 7
  else if (step === 7) {

    let answer = input.toLowerCase();

    if (answer === "yes") {

      reply = "What’s your name?";

      step = 8;
    }

    else if (answer === "no") {

      reply = "No problem at all — feel free to come back anytime.";

      step = 7;
    }

    else {

      reply = "Please type yes or no.";

      step = 7;
    }
  }

  // STEP 8
  else if (step === 8) {

    car.name = input;

    reply = "What’s your phone number?";

    step = 9;
  }

  // STEP 9
  else if (step === 9) {

    car.phone = input;

    reply = "What’s your email address?";

    step = 10;
  }

  // STEP 10
  else if (step === 10) {

    car.email = input;

    reply =
      "Thanks, your information has been submitted successfully. A participating dealer may reach out with possible options based on your vehicle details.";

    step = 11;
  }

  else {

    reply =
      "I’m still here if you’d like help with vehicle research, trade options, or purchase questions.";

  }

  addMessage("AI", reply, "ai");

  inputBox.value = "";
}

// ENTER KEY SUPPORT
document.getElementById("input")
  .addEventListener("keypress", function(event) {

    if (event.key === "Enter") {
      send();
    }

});

</script>

</body>

</html>

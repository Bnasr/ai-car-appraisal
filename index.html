<!DOCTYPE html>
<html>
<head>
  <title>AI Car Appraisal</title>
</head>

<body>

<h2>AI Car Appraisal</h2>

<div id="chat"></div>

<input id="input" type="text">
<button onclick="send()">Send</button>

<script>

let step = 0;

function send() {

  let inputBox = document.getElementById("input");
  let input = inputBox.value;

  if (input === "") {
    return;
  }

  let chat = document.getElementById("chat");

  chat.innerHTML += "<p><b>You:</b> " + input + "</p>";

  let reply = "";

  if (step === 0) {
    reply = "What’s the year, make, and model?";
    step = 1;
  }

  else if (step === 1) {
    reply = "How many miles?";
    step = 2;
  }

  else if (step === 2) {
    reply = "Condition? (clean / average / needs work)";
    step = 3;
  }

  else if (step === 3) {
    reply = "Any mechanical issues?";
    step = 4;
  }

  else if (step === 4) {
    reply = "Estimated trade range: $20,000 - $24,000";
    step = 5;
  }

  else {
    reply = "Thanks for using AI Car Appraisal.";
  }

  chat.innerHTML += "<p><b>AI:</b> " + reply + "</p>";

  inputBox.value = "";

}

</script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8" />

  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>AI Automotive Assistant</title>

  <style>

    body {
      font-family: Arial, sans-serif;
      background: #f4f4f4;
      max-width: 900px;
      margin: 40px auto;
      padding: 20px;
    }

    h2 {
      text-align: center;
      color: #222;
      margin-bottom: 20px;
    }

    #chat {
      background: white;
      border: 1px solid #ccc;
      border-radius: 10px;
      height: 560px;
      overflow-y: auto;
      padding: 20px;
      margin-bottom: 15px;
    }

    .user {
      margin-bottom: 14px;
      color: #111;
      line-height: 1.5;
    }

    .ai {
      margin-bottom: 20px;
      color: #0b5394;
      line-height: 1.6;
    }

    .input-area {
      display: flex;
      gap: 10px;
    }

    input {
      flex: 1;
      padding: 14px;
      font-size: 16px;
      border-radius: 8px;
      border: 1px solid #ccc;
    }

    button {
      padding: 14px 22px;
      font-size: 16px;
      border: none;
      background: #0b5394;
      color: white;
      border-radius: 8px;
      cursor: pointer;
    }

    button:hover {
      opacity: 0.92;
    }

  </style>

</head>

<body>

<h2>AI Automotive Assistant</h2>

<div id="chat"></div>

<div class="input-area">

  <input
    id="input"
    type="text"
    placeholder="Type your message here..."
  />

  <button onclick="send()">Send</button>

</div>

<script>

let step = 0;

let customer = {

  intent: "",

  vehicle: "",
  miles: 0,
  condition: "",
  mechanical: "",

  payoffStatus: "",

  shoppingType: "",
  paymentGoal: "",
  bodyStyle: "",

  tradeMentioned: false,

  name: "",
  phone: "",
  email: ""

};

function addMessage(sender, text, className) {

  const chat = document.getElementById("chat");

  chat.innerHTML += `
    <div class="${className}">
      <b>${sender}:</b> ${text}
    </div>
  `;

  chat.scrollTop = chat.scrollHeight;

}

function containsAny(text, keywords) {

  return keywords.some(word => text.includes(word));

}

function isSoftNo(text) {

  return containsAny(text, [
    "no",
    "not now",
    "later",
    "maybe later",
    "not today",
    "unsure",
    "maybe",
    "not yet"
  ]);

}

function isConversationEnd(text) {

  return containsAny(text, [
    "thanks",
    "thank you",
    "thx",
    "bye",
    "goodbye",
    "nothing",
    "all set",
    "that's all",
    "thats all"
  ]);

}

function isTradeIntent(text) {

  return containsAny(text, [
    "trade",
    "sell",
    "value",
    "appraisal"
  ]);

}

function isShoppingIntent(text) {

  return containsAny(text, [
    "buy",
    "lease",
    "payment",
    "new car",
    "vehicle",
    "shopping",
    "looking"
  ]);

}

function send() {

  const inputBox = document.getElementById("input");

  const input = inputBox.value.trim();

  if (input === "") return;

  addMessage("You", input, "user");

  const lowerInput = input.toLowerCase();

  let reply = "";

  // =========================
  // GLOBAL CONVERSATION END
  // =========================

  if (isConversationEnd(lowerInput)) {

    reply =
      "You’re very welcome — feel free to come back anytime if you need help with vehicles, trade values, or dealership questions. Have a great day!";

    addMessage("AI", reply, "ai");

    inputBox.value = "";

    step = 999;

    return;

  }

  // =========================
  // GREETING
  // =========================

  if (step === 0) {

    reply =
      "Hello! I’m your AI automotive assistant — how can I help make your visit easier today?";

    step = 1;

  }

  // =========================
  // MAIN INTENT DETECTION
  // =========================

  else if (step === 1) {

    customer.intent = input;

    // TRADE FLOW
    if (isTradeIntent(lowerInput)) {

      customer.tradeMentioned = true;

      reply =
        "Absolutely — I’d be happy to help with your trade appraisal. What’s the year, make, and model of the vehicle?";

      step = 10;

    }

    // SHOPPING FLOW
    else if (isShoppingIntent(lowerInput)) {

      reply =
        "Absolutely — are you considering a new vehicle, certified pre-owned, or pre-owned vehicle?";

      step = 50;

    }

    else {

      reply =
        "I can help with trade values, vehicle research, payment options, and dealership questions. What would you like help with?";

    }

  }

  // =========================
  // TRADE FLOW
  // =========================

  else if (step === 10) {

    customer.vehicle = input;

    reply =
      "How many miles are on the vehicle?";

    step = 11;

  }

  else if (step === 11) {

    customer.miles =
      parseInt(input.replace(/,/g, "")) || 0;

    reply =
      "How would you describe the condition? (clean / average / needs work)";

    step = 12;

  }

  else if (step === 12) {

    customer.condition = lowerInput;

    reply =
      "Are there any mechanical issues or warning lights?";

    step = 13;

  }

  else if (step === 13) {

    customer.mechanical = lowerInput;

    let value = 27000;

    // mileage adjustment
    value -= (customer.miles - 40000) * 0.05;

    // condition adjustment
    if (customer.condition.includes("clean")) {
      value += 1000;
    }

    if (customer.condition.includes("average")) {
      value -= 1000;
    }

    if (customer.condition.includes("work")) {
      value -= 3500;
    }

    // mechanical adjustment
    if (
      containsAny(customer.mechanical, [
        "yes",
        "light",
        "issue",
        "warning",
        "engine",
        "problem"
      ])
    ) {
      value -= 4000;
    }

    let low = Math.round(value - 1500);

    let high = Math.round(value + 1500);

    reply =
      "Based on what you described, a realistic trade range would likely fall around $" +
      low +
      " - $" +
      high +
      ". Keep in mind final value can vary depending on inspection, market conditions, and dealership demand.";

    step = 14;

  }

  else if (step === 14) {

    // CUSTOMER ALREADY SHOPPING
    if (
      customer.shoppingType !== "" ||
      customer.paymentGoal !== ""
    ) {

      reply =
        "I can also help explore vehicle options around your shopping preferences and payment goals. Would you like to continue? (yes/no)";

    }

    else {

      reply =
        "If you'd like, I can also help you explore vehicle options or possible dealer offers. Would you like to continue? (yes/no)";

    }

    step = 15;

  }

  else if (step === 15) {

    // CUSTOMER TALKS ABOUT SHOPPING
    if (isShoppingIntent(lowerInput)) {

      reply =
        "Absolutely — are you considering a new vehicle, certified pre-owned, or pre-owned vehicle?";

      step = 50;

    }

    // YES
    else if (lowerInput === "yes") {

      reply =
        "Great — is your current vehicle paid off, or do you still have a loan balance remaining?";

      step = 16;

    }

    // SOFT NO
    else if (isSoftNo(lowerInput)) {

      reply =
        "No problem at all — I’m still here if you’d like help with vehicle research, trade options, or dealership questions anytime.";

      step = 100;

    }

    else {

      reply =
        "Please type yes or no.";

    }

  }

  else if (step === 16) {

    customer.payoffStatus = input;

    reply =
      "Are you considering a new vehicle, certified pre-owned, or pre-owned vehicle?";

    step = 50;

  }

  // =========================
  // SHOPPING FLOW
  // =========================

  else if (step === 50) {

    customer.shoppingType = input;

    reply =
      "Do you have a target monthly payment range in mind?";

    step = 51;

  }

  else if (step === 51) {

    customer.paymentGoal = input;

    reply =
      "Great — are you interested in a sedan, SUV, truck, or still exploring options?";

    step = 52;

  }

  else if (step === 52) {

    customer.bodyStyle = input;

    // TRADE MENTION
    if (isTradeIntent(lowerInput)) {

      customer.tradeMentioned = true;

      reply =
        "Absolutely — I can help evaluate your trade while we explore options around your payment goals. What’s the year, make, and model of the vehicle?";

      step = 10;

    }

    else {

      reply =
        "Perfect — I can help explore options that may fit your preferences and payment goals.";

      // MEMORY CONTEXT
      if (customer.tradeMentioned) {

        reply +=
          " We can also factor in your trade during the process.";

      }

      reply +=
        " Would you like to connect with a dealership team member or schedule a test drive? (yes/no)";

      step = 60;

    }

  }

  // =========================
  // LEAD CAPTURE
  // =========================

  else if (step === 60) {

    // CUSTOMER TALKS ABOUT TRADE
    if (isTradeIntent(lowerInput)) {

      customer.tradeMentioned = true;

      reply =
        "Absolutely — I can help evaluate your trade while we continue exploring vehicle options. What’s the year, make, and model of the vehicle?";

      step = 10;

    }

    // YES
    else if (lowerInput === "yes") {

      reply =
        "Great — what’s your name?";

      step = 61;

    }

    // SOFT NO
    else if (isSoftNo(lowerInput)) {

      reply =
        "No problem at all — I’m still here if you’d like help researching vehicles or exploring your options further.";

      step = 100;

    }

    else {

      reply =
        "Please type yes or no.";

    }

  }

  else if (step === 61) {

    customer.name = input;

    reply =
      "What’s your phone number?";

    step = 62;

  }

  else if (step === 62) {

    customer.phone = input;

    reply =
      "What’s your email address?";

    step = 63;

  }

  else if (step === 63) {

    customer.email = input;

    reply =
      "Thanks, your information has been submitted successfully. A participating dealership team member may reach out to assist with next steps, vehicle options, or scheduling a visit.";

    step = 100;

  }

  // =========================
  // OPEN ASSISTANT MODE
  // =========================

  else if (step === 100) {

    // TRADE QUESTIONS
    if (isTradeIntent(lowerInput)) {

      customer.tradeMentioned = true;

      reply =
        "I’d be happy to help with a trade appraisal. What’s the year, make, and model of the vehicle?";

      step = 10;

    }

    // PAYMENT QUESTIONS
    else if (
      lowerInput.includes("payment") ||
      lowerInput.includes("$")
    ) {

      reply =
        "I can definitely help explore options around your target payment. Are you considering a new vehicle, certified pre-owned, or pre-owned vehicle?";

      step = 50;

    }

    // BUYING PROCESS
    else if (
      lowerInput.includes("process") ||
      lowerInput.includes("buying")
    ) {

      reply =
        "The process usually starts with researching vehicle options and evaluating your trade if you have one. From there, we can explore payment goals, vehicle choices, test drives, and then connect you with a dealership team member when you're ready.";

    }

    // PAYOFF
    else if (
      lowerInput.includes("payoff") ||
      lowerInput.includes("loan")
    ) {

      reply =
        "Having a payoff is completely normal. Once we understand your approximate payoff amount and trade value, we can help explore vehicle options and payment ranges that may work best for you.";

    }

    // SHOPPING QUESTIONS
    else if (isShoppingIntent(lowerInput)) {

      reply =
        "Absolutely — are you considering a new vehicle, certified pre-owned, or pre-owned vehicle?";

      step = 50;

    }

    else {

      reply =
        "I’m here to help with trade values, vehicle research, payment options, and dealership questions. What would you like help with?";

  }

  }

  addMessage("AI", reply, "ai");

  inputBox.value = "";

}

// ENTER KEY SUPPORT

document
  .getElementById("input")
  .addEventListener("keypress", function(event) {

    if (event.key === "Enter") {

      send();

    }

});

</script>

</body>

</html>

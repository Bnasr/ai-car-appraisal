<!DOCTYPE html>
<html>

<head>
  <title>AI Automotive Assistant</title>

  <style>

    body {
      font-family: Arial, sans-serif;
      background: #f4f4f4;
      max-width: 850px;
      margin: 40px auto;
      padding: 20px;
    }

    h2 {
      text-align: center;
      color: #222;
    }

    #chat {
      background: white;
      border: 1px solid #ccc;
      border-radius: 10px;
      height: 550px;
      overflow-y: auto;
      padding: 15px;
      margin-bottom: 15px;
    }

    .user {
      margin-bottom: 12px;
      color: #111;
    }

    .ai {
      margin-bottom: 18px;
      color: #0b5394;
      line-height: 1.5;
    }

    input {
      width: 74%;
      padding: 12px;
      font-size: 16px;
      border-radius: 6px;
      border: 1px solid #ccc;
    }

    button {
      padding: 12px 20px;
      font-size: 16px;
      border: none;
      background: #0b5394;
      color: white;
      border-radius: 6px;
      cursor: pointer;
    }

    button:hover {
      opacity: 0.9;
    }

  </style>

</head>

<body>

<h2>AI Automotive Assistant</h2>

<div id="chat"></div>

<input id="input" type="text" placeholder="Type your message here..." />

<button onclick="send()">Send</button>

<script>

let step = 0;

let customer = {
  intent: "",
  vehicle: "",
  miles: 0,
  condition: "",
  mechanical: "",
  payoff: "",
  paymentGoal: "",
  bodyStyle: "",
  vehicleType: "",
  name: "",
  phone: "",
  email: ""
};

function addMessage(sender, text, className) {

  const chat = document.getElementById("chat");

  chat.innerHTML += `
    <div class="${className}">
      <b>${sender}:</b> ${text}
    </div>
  `;

  chat.scrollTop = chat.scrollHeight;
}

function isSoftNo(text) {

  text = text.toLowerCase();

  return (
    text.includes("no") ||
    text.includes("not now") ||
    text.includes("later") ||
    text.includes("maybe") ||
    text.includes("not today") ||
    text.includes("unsure")
  );
}

function isConversationEnd(text) {

  text = text.toLowerCase();

  return (
    text.includes("thanks") ||
    text.includes("thank you") ||
    text.includes("thx") ||
    text.includes("bye") ||
    text.includes("goodbye") ||
    text.includes("nothing") ||
    text.includes("all set")
  );
}

function send() {

  const inputBox = document.getElementById("input");

  const input = inputBox.value.trim();

  if (input === "") return;

  addMessage("You", input, "user");

  const lowerInput = input.toLowerCase();

  let reply = "";

  // GREETING
  if (step === 0) {

    reply =
      "Hello! I’m your AI automotive assistant — how can I help make your visit easier today?";

    step = 1;
  }

  // INTENT DETECTION
  else if (step === 1) {

    customer.intent = input;

    if (
      lowerInput.includes("sell") ||
      lowerInput.includes("trade") ||
      lowerInput.includes("value")
    ) {

      reply =
        "Absolutely — I’d be happy to help with that. What’s the year, make, and model of the vehicle?";

      step = 2;
    }

    else if (
      lowerInput.includes("buy") ||
      lowerInput.includes("payment") ||
      lowerInput.includes("lease") ||
      lowerInput.includes("new car") ||
      lowerInput.includes("vehicle")
    ) {

      reply =
        "Absolutely — are you considering a new vehicle, certified pre-owned, or pre-owned vehicle?";

      step = 20;
    }

    else {

      reply =
        "I can help with trade values, vehicle research, purchase options, and dealership questions. What would you like help with?";
    }
  }

  // =========================
  // TRADE APPRAISAL FLOW
  // =========================

  else if (step === 2) {

    customer.vehicle = input;

    reply =
      "How many miles are on the vehicle?";

    step = 3;
  }

  else if (step === 3) {

    customer.miles =
      parseInt(input.replace(/,/g, "")) || 0;

    reply =
      "How would you describe the condition? (clean / average / needs work)";

    step = 4;
  }

  else if (step === 4) {

    customer.condition = lowerInput;

    reply =
      "Are there any mechanical issues or warning lights?";

    step = 5;
  }

  else if (step === 5) {

    customer.mechanical = lowerInput;

    let value = 27000;

    // mileage adjustment
    value -= (customer.miles - 40000) * 0.05;

    // condition adjustment
    if (customer.condition.includes("clean")) {
      value += 1000;
    }

    if (customer.condition.includes("average")) {
      value -= 1000;
    }

    if (customer.condition.includes("work")) {
      value -= 3500;
    }

    // mechanical adjustment
    if (
      customer.mechanical.includes("yes") ||
      customer.mechanical.includes("light") ||
      customer.mechanical.includes("issue") ||
      customer.mechanical.includes("warning") ||
      customer.mechanical.includes("engine")
    ) {
      value -= 4000;
    }

    let low = Math.round(value - 1500);

    let high = Math.round(value + 1500);

    reply =
      "Based on what you described, a realistic trade range would likely fall around $" +
      low +
      " - $" +
      high +
      ". Keep in mind final value can vary depending on inspection, market conditions, and dealership demand.";

    step = 6;
  }

  else if (step === 6) {

    reply =
      "If you'd like, I can also help you explore possible dealer offers or purchase options. Would you like to continue? (yes/no)";

    step = 7;
  }

  else if (step === 7) {

    // TRADE DETECTED
    if (
      lowerInput.includes("trade")
    ) {

      reply =
        "Absolutely — I can help with your trade as well. What’s the year, make, and model of the vehicle?";

      step = 2;
    }

    // YES
    else if (lowerInput === "yes") {

      reply =
        "Great — is your vehicle currently paid off, or do you still have a loan balance remaining?";

      step = 8;
    }

    // SOFT NO
    else if (isSoftNo(lowerInput)) {

      reply =
        "No problem at all — I’m still here if you’d like help with vehicle research, trade options, or dealership questions anytime.";

      step = 100;
    }

    else {

      reply =
        "Please type yes or no.";

      step = 7;
    }
  }

  else if (step === 8) {

    customer.payoff = input;

    reply =
      "Are you considering a new vehicle, certified pre-owned, or pre-owned vehicle?";

    step = 20;
  }

  // =========================
  // SHOPPING FLOW
  // =========================

  else if (step === 20) {

    customer.vehicleType = input;

    reply =
      "Do you have a target monthly payment range in mind?";

    step = 21;
  }

  else if (step === 21) {

    customer.paymentGoal = input;

    reply =
      "Great — are you interested in a sedan, SUV, truck, or still exploring options?";

    step = 22;
  }

  else if (step === 22) {

    customer.bodyStyle = input;

    reply =
      "Perfect — I can help explore options that may fit your preferences and payment goals.";

    // CUSTOMER MENTIONS TRADE
    if (
      lowerInput.includes("trade")
    ) {

      reply +=
        " I can also help evaluate your trade. What’s the year, make, and model of the vehicle?";

      step = 2;
    }

    else {

      reply +=
        " Would you like to connect with a dealership team member or schedule a test drive? (yes/no)";

      step = 30;
    }
  }

  // =========================
  // LEAD CAPTURE
  // =========================

  else if (step === 30) {

    // TRADE MENTION
    if (
      lowerInput.includes("trade")
    ) {

      reply =
        "Absolutely — I can help with your trade as well. What’s the year, make, and model of the vehicle?";

      step = 2;
    }

    // YES
    else if (lowerInput === "yes") {

      reply =
        "Great — what’s your name?";

      step = 31;
    }

    // SOFT NO
    else if (isSoftNo(lowerInput)) {

      reply =
        "No problem at all — I’m still here if you’d like help researching vehicles or exploring your options further.";

      step = 100;
    }

    else {

      reply =
        "Please type yes or no.";

      step = 30;
    }
  }

  else if (step === 31) {

    customer.name = input;

    reply =
      "What’s your phone number?";

    step = 32;
  }

  else if (step === 32) {

    customer.phone = input;

    reply =
      "What’s your email address?";

    step = 33;
  }

  else if (step === 33) {

    customer.email = input;

    reply =
      "Thanks, your information has been submitted successfully. A participating dealership team member may reach out to assist with next steps, vehicle options, or scheduling a visit.";

    step = 100;
  }

  // =========================
  // OPEN ASSISTANT MODE
  // =========================

  else if (step === 100) {

    // CONVERSATION END
    if (isConversationEnd(lowerInput)) {

      reply =
        "You’re very welcome — feel free to come back anytime if you need help with vehicles, trade values, or dealership questions. Have a great day!";

      step = 101;
    }

    // PAYMENT QUESTIONS
    else if (
      lowerInput.includes("payment") ||
      lowerInput.includes("$")
    ) {

      reply =
        "I can definitely help explore options around your target payment. Are you considering new, certified pre-owned, or pre-owned vehicles?";

      step = 20;
    }

    // TRADE QUESTIONS
    else if (
      lowerInput.includes("trade") ||
      lowerInput.includes("value")
    ) {

      reply =
        "I’d be happy to help with a trade appraisal. What’s the year, make, and model of the vehicle?";

      step = 2;
    }

    // BUYING PROCESS
    else if (
      lowerInput.includes("buying process") ||
      lowerInput.includes("process")
    ) {

      reply =
        "The process usually starts with researching vehicle options and evaluating your trade if you have one. From there, we can explore payment goals, vehicle choices, test drives, and then connect you with a dealership team member when you're ready.";
    }

    // PAYOFF
    else if (
      lowerInput.includes("payoff") ||
      lowerInput.includes("loan")
    ) {

      reply =
        "Having a payoff is completely normal. Once we understand your approximate payoff amount and trade value, we can help explore vehicle options and payment ranges that may work best for you.";
    }

    else {

      reply =
        "I’m here to help with trade values, vehicle research, purchase options, and dealership questions. What would you like help with?";
    }
  }

  // FINAL CLOSED MODE
  else if (step === 101) {

    reply =
      "Have a great day!";

  }

  addMessage("AI", reply, "ai");

  inputBox.value = "";

}

document
  .getElementById("input")
  .addEventListener("keypress", function(event) {

    if (event.key === "Enter") {

      send();

    }

});

</script>

</body>

</html>
